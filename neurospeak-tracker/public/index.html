<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NeuroSpeak COD Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: operations console — pipeline strip on top, filter bar, then a dense order ledger (cards on phones). */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d5dcd9; --ink:#16201d; --muted:#5d6b66;
  --accent:#b86e00; --accent-ink:#ffffff; --accent-soft:#fbecd3;
  --ok:#1f7a4d; --ok-soft:#dcf1e5; --warn:#a15c00; --warn-soft:#fdeccc; --bad:#b3261e; --bad-soft:#fbe0dd; --info:#245b9e; --info-soft:#dfe9f7; --neutral-soft:#e6eae8;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201d; --sunk:#0d1311; --line:#2a3531; --ink:#e4ebe8; --muted:#94a39d;
  --accent:#f0a53a; --accent-ink:#1a1206; --accent-soft:#3a2a12;
  --ok:#6fd39c; --ok-soft:#173326; --warn:#f0b75e; --warn-soft:#3a2a12; --bad:#f28b82; --bad-soft:#3b1d1b; --info:#8fb8ef; --info-soft:#1a2a40; --neutral-soft:#222c29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201d; --sunk:#0d1311; --line:#2a3531; --ink:#e4ebe8; --muted:#94a39d;
  --accent:#f0a53a; --accent-ink:#1a1206; --accent-soft:#3a2a12;
  --ok:#6fd39c; --ok-soft:#173326; --warn:#f0b75e; --warn-soft:#3a2a12; --bad:#f28b82; --bad-soft:#3b1d1b; --info:#8fb8ef; --info-soft:#1a2a40; --neutral-soft:#222c29; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-stretch:80%;font-weight:800;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.01em;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button:disabled{opacity:.5;cursor:default}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:6px}
/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--line))}
.tile:hover{border-color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tile .val{font-family:var(--display);font-stretch:80%;font-weight:700;font-size:26px;line-height:1.1}
.tile .amt{font-family:var(--mono);font-size:12px;color:var(--muted)}
/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
.bar select{flex:0 1 auto}
.count{margin-left:auto;color:var(--muted);font-size:13px}
/* ledger */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(170px,1.5fr) 108px 64px 150px 132px 160px minmax(120px,1fr) minmax(130px,1.2fr) 108px;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.row.head{border-top:0;background:var(--sunk);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.row>*{min-width:0}
.row select,.row input{width:100%;padding:5px 7px;font-size:13px}
.cust .nm{font-weight:600;overflow-wrap:anywhere}
.cust .ph{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:12.5px;color:var(--muted)}
.copy{padding:1px 6px;font-size:11px;font-weight:500;border-radius:4px}
.src{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:4px;vertical-align:1px}
.src.W{background:var(--neutral-soft);color:var(--muted)}
.src.N{background:var(--info-soft);color:var(--info)}
.src.A{background:var(--accent-soft);color:var(--accent)}
.dup{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:3px;margin-left:4px;vertical-align:1px;background:var(--bad-soft);color:var(--bad)}
.when{font-size:12.5px}
.age{font-size:11.5px;font-weight:600;border-radius:3px;padding:0 5px;display:inline-block;margin-top:2px}
.age.a1{background:var(--neutral-soft);color:var(--muted)}.age.a2{background:var(--warn-soft);color:var(--warn)}.age.a3{background:var(--bad-soft);color:var(--bad)}
.price{font-weight:500;text-align:right}
.callcell{display:flex;gap:4px;align-items:center}
.callcell select{flex:1}
.plus{padding:4px 7px;font-size:12px;white-space:nowrap}
.attempts{font-size:11px;color:var(--muted);margin-top:2px}
select[data-tone=ok]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
select[data-tone=warn]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
select[data-tone=bad]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
select[data-tone=info]{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.upd{font-size:11.5px;color:var(--muted);line-height:1.3}
.row.cancelled .nm{text-decoration:line-through;text-decoration-color:var(--bad)}
.more{display:flex;justify-content:center;padding:14px;border-top:1px solid var(--line)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.cap{display:none;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:2px}
@media (max-width:1100px){
  .row.head{display:none}
  .row{grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px}
  .cust{grid-column:1/-1}
  .cap{display:block}
  .price{text-align:left}
}
/* dialog */
.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.dlg h2{font-family:var(--display);font-stretch:85%;font-size:20px;margin:0}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.err{color:var(--bad);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:30}
@media (prefers-reduced-motion:no-preference){.tile,button{transition:border-color .12s}}

.call{font-size:11px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.call:hover{border-color:var(--accent)}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sync{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.sync.bad{background:var(--bad-soft);color:var(--bad)}
.linkish{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:12.5px}
.linkish:focus-visible{outline:2px solid var(--accent)}
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login h1{font-size:26px}
.login p{margin:0;color:var(--muted)}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.login .chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13px}
.login .chk input{width:auto}
html,body{height:100%}

</style>
</head>
<body>
<div class="login" id="login" hidden>
  <form id="loginForm">
    <h1>NeuroSpeak COD Tracker</h1>
    <p>Enter your name and the team passcode.</p>
    <label for="lUser">Your name<input id="lUser" autocomplete="name" maxlength="60" placeholder="e.g. Jen (caller)"></label>
    <label for="lPass">Team passcode<input id="lPass" type="password" autocomplete="current-password" required></label>
    <label class="chk" for="lRemember"><input type="checkbox" id="lRemember" checked> Keep me signed in on this device</label>
    <div class="err" id="lErr" role="alert"></div>
    <button class="primary" id="lBtn" type="submit">Open tracker</button>
  </form>
</div>
<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>NeuroSpeak COD Tracker</h1>
      <div class="sub" id="sub">Loading orders…</div>
      <div class="meta"><span class="sync" id="sync">Connecting…</span><span>Signed in as <strong id="who"></strong></span><button class="linkish" id="signOut" type="button">Sign out</button></div>
    </div>
    <div class="actions">
      <button id="addBtn" type="button">Add order</button>
      <button id="exportBtn" type="button">Export CSV</button>
    </div>
  </header>
  <section class="pipe" id="pipe" aria-label="Order pipeline"></section>
  <div class="bar">
    <input type="search" id="q" placeholder="Search name or phone" aria-label="Search name or phone">
    <select id="fCall" aria-label="Call status"></select>
    <select id="fDec" aria-label="Customer decision"></select>
    <select id="fStage" aria-label="Delivery stage"></select>
    <select id="fDate" aria-label="Order date"></select>
    <select id="sort" aria-label="Sort">
      <option value="old">Oldest first</option>
      <option value="new">Newest first</option>
      <option value="price">Highest price</option>
      <option value="upd">Recently updated</option>
    </select>
    <span class="count num" id="count"></span>
  </div>
  <section class="ledger" aria-label="Orders">
    <div class="row head">
      <div>Customer</div><div>Ordered</div><div style="text-align:right">Price</div><div>Call</div><div>Decision</div><div>Delivery stage</div><div>Tracking no.</div><div>Notes</div><div>Last update</div>
    </div>
    <div id="rows"><div class="empty">Loading orders…</div></div>
  </section>
</div>
<div id="dlgRoot"></div>
<script src="/app.js"></script>
</body>
</html>
